# WEBDEV2 Week 8 demo — MySQL settings (Topics 4-5).
# Every property here is a teaching point; read the comments.
#
# The demo uses the SAME locally hosted MySQL server from INFOMAN1 and the
# Week 7 labs — not an in-memory database — so what you see here transfers
# directly to real projects. Four values to check against your own setup:
#   host name .... localhost            (this machine)
#   port ......... 3307                 (INFOMAN1 convention; use 3306 if that is
#                                        how your MySQL was configured)
#   database ..... webdev2_week8        (create it once, see README)
#   credentials .. your MySQL root user + the password you chose at install

server.port=8080

# JDBC URL broken down: jdbc:mysql://<host>:<port>/<database>
# createDatabaseIfNotExist saves you if you forgot the CREATE DATABASE step.
spring.datasource.url=jdbc:mysql://localhost:3307/webdev2_week8?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
# CHANGE THIS to your own MySQL root password before running.
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- Schema handling (ddl-auto). DANGER-RANKED, see Topic 5 slides: ---
# update = add missing tables/columns, never drop. Safe for development.
# validate = check only. create / create-drop WIPE data — tests only, never prod.
spring.jpa.hibernate.ddl-auto=update

# Show every SQL statement Hibernate sends (Topic 5, step 3 of the workflow).
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Bind-parameter values (replaces "?" placeholders with real values in the log).
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.hibernate.SQL=DEBUG
