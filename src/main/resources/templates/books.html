<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Book List</title>
</head>

<body>

    <h1>Books</h1>

    <!-- Show this message only when the list is empty -->
    <p th:if="${books.isEmpty()}">
        No books found.
    </p>

    <!-- The list is shown when books exist -->
    <ul th:unless="${books.isEmpty()}">

        <!-- Repeat this <li> once for every book -->
        <li th:each="book : ${books}">

            <strong th:text="${book.title}">
                Sample Title
            </strong>

            <span>
                by
            </span>

            <span th:text="${book.author.name}">
                Sample Author
            </span>

        </li>

    </ul>

</body>

</html>
