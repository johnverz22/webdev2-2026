<!DOCTYPE html>
<!-- Shared create/edit form (Week 4 pattern: th:object + th:field + th:errors).
     One template does both jobs — the action URL switches on whether the
     backing product already has an id. -->
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${product.id} == null ? 'New product' : 'Edit product'">New product</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <header class="page-header">
        <h1 class="page-title" th:text="${product.id} == null ? 'New product' : 'Edit product'">New product</h1>
        <p class="page-subtitle">Fields marked with validation messages must be fixed before saving.</p>
    </header>

    <main class="card">
        <form class="form-card two-col" th:object="${product}"
              th:action="${product.id} == null ? @{/products} : @{/products/{id}(id=${product.id})}"
              method="post">
            <div class="field">
                <label>Name (unique)</label>
                <input type="text" th:field="*{name}"/>
                <span class="field-error" th:errors="*{name}"></span>
            </div>
            <div class="field">
                <label>Price</label>
                <input type="number" step="0.01" th:field="*{price}"/>
                <span class="field-error" th:errors="*{price}"></span>
            </div>
            <div class="field">
                <label>Category</label>
                <input type="text" th:field="*{category}"/>
                <span class="field-error" th:errors="*{category}"></span>
            </div>
            <div class="field">
                <label>Stock</label>
                <input type="number" th:field="*{stock}"/>
                <span class="field-error" th:errors="*{stock}"></span>
            </div>
            <div class="field full checkbox-row">
                <label>
                    <input type="checkbox" th:field="*{active}"/> Active
                </label>
            </div>
            <div class="form-actions full">
                <button class="btn btn-primary" type="submit">Save</button>
                <a class="btn" th:href="@{/products}">Cancel</a>
            </div>
        </form>
    </main>
</div>

<footer class="footer">Week 8 JPA demo — product form</footer>
</body>
</html>
