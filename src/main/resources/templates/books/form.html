<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add a Book &middot; Book Manager</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/layout :: header}"></div>

<main class="container">
    <h1>Add a Book</h1>

    <!--
      WEEK 4 CALLBACK: th:object binds this form to the `book` model
      attribute; th:field binds each input to one of its properties.

      TOPIC 3: th:errors shows the exact `message` text declared on
      each @NotBlank annotation in Book.java, once @Valid rejects a
      submission.
    -->
    <form th:action="@{/books}" th:object="${book}" method="post" class="book-form">

        <div class="form-group">
            <label for="title">Title</label>
            <input type="text" id="title" th:field="*{title}"
                   th:classappend="${#fields.hasErrors('title')} ? 'input-error'">
            <p class="field-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">
                Title error
            </p>
        </div>

        <div class="form-group">
            <label for="author">Author</label>
            <input type="text" id="author" th:field="*{author}"
                   th:classappend="${#fields.hasErrors('author')} ? 'input-error'">
            <p class="field-error" th:if="${#fields.hasErrors('author')}" th:errors="*{author}">
                Author error
            </p>
        </div>

        <button type="submit">Save Book</button>
    </form>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
