<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Add Book</title>
</head>

<body>

    <header>
        <div th:replace="~{fragments/navbar :: navbar}"></div>
    </header>

    <main>
        <h1>Add Book</h1>

        <form th:action="@{/books}"
              th:object="${book}"
              method="post">

            <div>
                <label for="title">Title:</label>
                <input id="title"
                       th:field="*{title}">
            </div>

            <div>
                <label for="author">Author:</label>
                <input id="author"
                       th:field="*{author}">
            </div>

            <button type="submit">Save</button>
        </form>

    </main>
</body>
</html>
