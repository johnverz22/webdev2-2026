<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Book Details</title>
</head>

<body>

    <h1>Book Details</h1>

    <!-- Reads the "title" property from the "book" Model attribute -->
    <h2 th:text="${book.title}">
        Placeholder Title
    </h2>

    <!-- Reads a nested property: book → author → name -->
    <p>
        Author:
        <span th:text="${book.author.name}">
            Placeholder Author
        </span>
    </p>

</body>

</html>
